name: CI

on:
  push:
  pull_request:

jobs:
  build-test-bench:
    name: Build, test and bench
    runs-on: ubuntu-24.04
    container:
      image: alpine:latest
    steps:
      - name: Install the toolchain
        shell: sh
        run: |
          apk add --no-cache \
            nodejs git git-doc make build-base musl-dev linux-headers clang \
            llvm lld compiler-rt yash bash dash zsh busybox coreutils mandoc \
            util-linux-misc python3
          [ -e /bin/dash ] || ln -s /usr/bin/dash /bin/dash
          git config --global --add safe.directory '*'
          llvm_bin=$(find /usr/lib /usr/bin -name llvm-profdata 2>/dev/null \
            | head -1 | xargs -r dirname)
          [ -n "$llvm_bin" ] && echo "$llvm_bin" >> "$GITHUB_PATH"
          clang++ --version
          ld.lld --version
          busybox | head -1

      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Build ASAN binary
        run: make shit

      - name: Run golden tests
        run: make test

      - name: Build release binary
        run: make clean && make CXX=g++ USE_LD= MODE=rel shit

      - name: Run benchmark
        run: >-
          SCALE=200 BENCH_WARMUP_COUNT=2 BENCH_SAMPLE_COUNT=7
          DASH_SPEEDUP_REQUIRED=1 BASH_SPEEDUP_REQUIRED=5
          make MODE=rel bench

      - name: Build release binary with code coverage
        if: '!cancelled()'
        run: make clean && make MODE=cov shit

      - name: Run tests under release coverage binary
        if: '!cancelled()'
        run: make MODE=cov test

      - name: Record release binary coverage
        if: always()
        shell: bash
        run: |
          ./scripts/llvm-tool.sh llvm-profdata merge -sparse \
            coverage/profraw/*.profraw \
            -o coverage/shit.profdata
          {
            echo '## Coverage'
            echo
            echo '| File | Line cover | Branch cover |'
            echo '| --- | --- | --- |'
            ./scripts/llvm-tool.sh llvm-cov report ./shit-cov \
              -instr-profile=coverage/shit.profdata src \
              -ignore-filename-regex='toiletline' \
              | awk 'NF>=13 && $1!="Filename" && $1!~/^-/ \
                     { print "| "$1" | "$10" | "$13" |" }'
            echo
            echo '<details><summary>Uncovered line ranges</summary>'
            echo
            echo '| File | Uncovered lines |'
            echo '| --- | --- |'
            ./scripts/llvm-tool.sh llvm-cov export ./shit-cov \
              -instr-profile=coverage/shit.profdata src \
              -ignore-filename-regex='toiletline' -format=lcov \
              | awk '
                  /^SF:/ { f=$0; sub(/^SF:/,"",f); sub(/.*\/src\//,"",f);
                           s=0; p=0; next }
                  /^DA:/ {
                    split(substr($0,4),a,","); l=a[1]+0; c=a[2]+0;
                    if (c==0) {
                      if (s==0) { s=l; p=l }
                      else if (l==p+1) { p=l }
                      else { r[f]=r[f] (r[f]?", ":"") (s==p?s:s"-"p); s=l; p=l }
                    }
                    next
                  }
                  /^end_of_record/ {
                    if (s!=0) r[f]=r[f] (r[f]?", ":"") (s==p?s:s"-"p);
                    s=0; p=0; next
                  }
                  END { for (f in r) print "| "f" | "r[f]" |" }
                ' | sort
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

  debug-macos:
    name: Run debug build tests on macOS
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install the test shells
        run: |
          brew install bash dash-shell
          echo "BASHP=$(brew --prefix bash)/bin/bash" >> "$GITHUB_ENV"
          echo "DASH=$(brew --prefix dash-shell)/bin/dash" >> "$GITHUB_ENV"

      - name: Verify the test toolchain
        run: |
          for tool in make clang++ python3 perl script expect mkfifo strings; do
            command -v "$tool"
          done
          test -x /bin/stty
          "$BASHP" --version | head -1
          "$DASH" -c 'echo dash available'
          make --version | head -1
          clang++ --version | head -1
          python3 --version

      - name: Run debug tests
        run: make MODE=dbg test

  debug-windows:
    name: Run debug build tests on Windows
    runs-on: windows-2025
    env:
      MSYS: winsymlinks:nativestrict
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install the test toolchain
        shell: pwsh
        run: |
          if (-not (Get-Command winget.exe -ErrorAction SilentlyContinue)) {
            Install-Module -Name Microsoft.WinGet.Client -Force `
              -Repository PSGallery
            Repair-WinGetPackageManager -AllUsers
          }
          $developerModePath = `
            'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock'
          New-Item -Path $developerModePath -Force | Out-Null
          New-ItemProperty -Path $developerModePath `
            -Name AllowDevelopmentWithoutDevLicense -Value 1 `
            -PropertyType DWord -Force | Out-Null
          $makeRoot = 'C:\GnuWin32'
          winget install --id GnuWin32.Make --exact --version 3.81 `
            --source winget --location $makeRoot --silent `
            --accept-package-agreements --accept-source-agreements `
            --disable-interactivity
          if ($LASTEXITCODE -ne 0) {
            throw "WinGet failed to install GNU Make, exit $LASTEXITCODE"
          }
          $makePath = "$makeRoot\bin\make.exe"
          if (-not (Test-Path -LiteralPath $makePath)) {
            throw "WinGet did not install GNU Make at $makePath"
          }
          "$makeRoot\bin" |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          'C:\msys64\usr\bin' |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify the test toolchain
        shell: pwsh
        run: |
          $makePath = 'C:/GnuWin32/bin/make.exe'
          $resolvedMakePath = (Get-Command make.exe -ErrorAction Stop).Source `
            -replace '\\', '/'
          if ($resolvedMakePath -ne $makePath) {
            throw "Unexpected make executable at $resolvedMakePath"
          }
          $makeVersion = make.exe --version | Select-Object -First 1
          if ($makeVersion -ne 'GNU Make 3.81') {
            throw "Unexpected make version: $makeVersion"
          }
          $shPath = 'C:/msys64/usr/bin/sh.exe'
          $resolvedShPath = (Get-Command sh.exe -ErrorAction Stop).Source `
            -replace '\\', '/'
          if ($resolvedShPath -ne $shPath) {
            throw "Unexpected sh executable at $resolvedShPath"
          }
          $shellPlatform = sh.exe -c 'uname -s'
          if ($shellPlatform -notlike 'MSYS_NT-*') {
            throw "Unexpected shell platform: $shellPlatform"
          }
          sh.exe -c `
            'for tool in diff env git mkfifo mktemp perl rm script sed strings stty tee; do command -v "$tool" || exit 1; done; test -x /bin/stty'
          if ($LASTEXITCODE -ne 0) {
            throw "The MSYS2 golden test toolchain is incomplete"
          }
          $symlinkProbeDirectory = Join-Path ([IO.Path]::GetTempPath()) `
            "shit-symlink-$([guid]::NewGuid())"
          $symlinkProbePath = $symlinkProbeDirectory -replace '\\', '/'
          $symlinkProbeCommand = `
            'mkdir -p "$1/target" && ' +
            'ln -s target "$1/directory-link" && ' +
            ': > "$1/missing" && ln -s missing "$1/dangling-link" && ' +
            'mv "$1/missing" "$1/moved"'
          sh.exe -c $symlinkProbeCommand sh $symlinkProbePath
          if ($LASTEXITCODE -ne 0) {
            throw "MSYS2 could not create native test symlinks"
          }
          foreach ($linkName in 'directory-link', 'dangling-link') {
            $link = Get-Item -LiteralPath `
              (Join-Path $symlinkProbeDirectory $linkName) -Force
            if ($link.LinkType -ne 'SymbolicLink') {
              throw "$linkName is not a native symbolic link"
            }
          }
          Remove-Item -LiteralPath $symlinkProbeDirectory -Recurse -Force
          Get-Command winget.exe -ErrorAction Stop
          Get-Command clang++.exe -ErrorAction Stop
          Get-Command python3.exe -ErrorAction Stop
          clang++ --version | Select-Object -First 1
          sh --version | Select-Object -First 1
          python3 --version

      - name: Run debug tests
        shell: pwsh
        run: make.exe -j1 TEST_HOST_MAKE=make.exe SHELL=C:/msys64/usr/bin/sh.exe MODE=dbg test
